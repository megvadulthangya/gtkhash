name: Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  autotools-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libtool \
            gettext \
            autopoint \
            appstream \
            libglib2.0-dev \
            libgtk-3-dev \
            libgcrypt20-dev \
            nettle-dev \
            libb2-dev \
            libmbedtls-dev \
            libssl-dev \
            linux-libc-dev \
            librsvg2-bin \
            libxml2-utils \
            at-spi2-core \
            xvfb \
            gnome-icon-theme \
            libnautilus-extension-dev \
            libnemo-extension-dev \
            libcaja-extension-dev \
            libthunarx-3-dev

      - name: Autogen and distcheck
        run: |
          export NO_AT_BRIDGE=1
          ./autogen.sh
          export DISTCHECK_CONFIGURE_FLAGS="--enable-debug \
            --enable-blake2 \
            --enable-gcrypt \
            --enable-glib-checksums \
            --enable-mbedtls \
            --enable-nettle \
            --enable-libcrypto \
            --enable-linux-crypto \
            --enable-nautilus \
            --enable-nemo \
            --enable-caja \
            --enable-thunar \
            --disable-dependency-tracking"
          ./configure $DISTCHECK_CONFIGURE_FLAGS
          make -j$(nproc) VERBOSE=1 DESTDIR=$(mktemp -d) distcheck

  meson-ubuntu:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [gcc, clang]
    env:
      CC: ${{ matrix.compiler }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            meson \
            gettext \
            appstream \
            libglib2.0-dev \
            libgtk-3-dev \
            libgcrypt20-dev \
            nettle-dev \
            libb2-dev \
            libmbedtls-dev \
            libssl-dev \
            linux-libc-dev \
            librsvg2-bin \
            libxml2-utils \
            at-spi2-core \
            xvfb \
            gnome-icon-theme \
            libnautilus-extension-dev \
            libnemo-extension-dev \
            libcaja-extension-dev \
            libthunarx-3-dev \
            ninja-build

      - name: Meson setup
        run: |
          meson setup _build \
            --buildtype=debug \
            -Dglib-checksums=true \
            -Dlibcrypto=true \
            -Dlinux-crypto=true \
            -Dmbedtls=true \
            -Dnettle=true \
            -Dbuild-caja=true \
            -Dbuild-nautilus=true \
            -Dbuild-nemo=true \
            -Dbuild-thunar=true

      - name: Build
        run: ninja -C _build

      - name: Test
        run: xvfb-run -s "-screen 0 800x600x24" meson test -v -C _build

  archlinux:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Update system and install dependencies
        run: |
          pacman -Sy --noconfirm archlinux-keyring
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed \
            base-devel \
            meson \
            glib2 \
            gtk3 \
            librsvg \
            gsettings-desktop-schemas \
            adwaita-icon-theme \
            xorg-server-xvfb \
            libgcrypt \
            nettle \
            libb2 \
            mbedtls \
            openssl \
            linux-api-headers \
            gettext \
            appstream \
            pkgconf \
            nautilus \
            nemo \
            caja \
            thunar

      - name: Checkout
        uses: actions/checkout@v4

      - name: Meson setup
        run: |
          meson setup _build \
            --buildtype=debug \
            -Dglib-checksums=true \
            -Dlibcrypto=true \
            -Dlinux-crypto=true \
            -Dmbedtls=true \
            -Dnettle=true \
            -Dbuild-caja=true \
            -Dbuild-nautilus=true \
            -Dbuild-nemo=true \
            -Dbuild-thunar=true

      - name: Build
        run: ninja -C _build

      - name: Test
        run: xvfb-run -s "-screen 0 800x600x24" meson test -v -C _build