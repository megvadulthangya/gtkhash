# ==============================================================================
# Release Workflow for GtkHash
# ==============================================================================
#
# This workflow automates the creation of a GitHub Release for GtkHash.
# It is triggered either by pushing a new version tag (v*) or manually via
# workflow_dispatch (useful for testing and one-off releases).
#
# Key design decisions (respecting the maintainer's preferences):
#   - No third-party actions are used for the release logic itself.
#     * GitHub CLI (`gh`) handles release creation and asset upload.
#     * The only "external" action is `msys2/setup-msys2@v2` which is the
#       de-facto standard for MSYS2 environments and cannot be avoided for
#       building Windows binaries.
#   - The workflow is **self-contained** – it does NOT depend on artifacts
#     from other workflows (compatibility-validation.yml, msys2.yml).
#     Instead it repeats the necessary build steps here. This guarantees
#     that the exact commit tagged is built and released, regardless of the
#     state of other workflow runs.
#   - When a real tag is pushed (`push` event) the release is created as a
#     **draft** so the maintainer can review/edit the release notes before
#     publishing.  When the workflow is triggered manually (`workflow_dispatch`)
#     the release is **published immediately**, because the user is actively
#     creating a release.
#   - Release notes are a hybrid: the full content of the `NEWS` file plus
#     a commit log since the previous tag.
#   - A Flathub manifest update step is optionally run if the secret
#     `FLATHUB_TOKEN` is available; otherwise it emits a warning.
#   - On manual trigger the workflow automatically bumps the version in
#     meson.build, configure.ac, NEWS and msys2/gtkhash.iss, commits and
#     pushes the change before building.  This guarantees that the embedded
#     version matches the release tag.
#
# Required secrets/permissions:
#   - GITHUB_TOKEN with `contents: write` (set in repo Settings > Actions > General).
#   - (Optional) FLATHUB_TOKEN – a GitHub PAT with push access to
#     `flathub/org.gtkhash.gtkhash`.
# ==============================================================================

name: Release

# ---------------------------------------------------------------------
# Triggers: push of a version tag (v*) or manual dispatch.
# ---------------------------------------------------------------------
on:
  push:
    tags:
      - 'v*'   # any tag starting with "v", e.g. v1.5.1
  workflow_dispatch:    # manual trigger from the Actions tab
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.5.1)'   # user-provided tag
        required: true
        type: string

# ---------------------------------------------------------------------
# Global permissions: allow writing release assets and pushing commits.
# ---------------------------------------------------------------------
permissions:
  contents: write

jobs:

  # ==========================================================================
  # BUMP VERSION (manual runs only)
  # ==========================================================================
  # Updates meson.build, configure.ac, NEWS and msys2/gtkhash.iss to reflect
  # the new release version, commits and pushes the change, and outputs the
  # new commit SHA.  This job is skipped for tag pushes (maintainer already
  # bumped the version).
  # ==========================================================================
  bump-version:
    name: Bump version in sources
    runs-on: ubuntu-latest
    # Only run when triggered manually; skip for tag pushes.
    if: github.event_name == 'workflow_dispatch'
    # Output the commit SHA after bumping so later jobs can checkout that commit.
    outputs:
      commit_sha: ${{ steps.push.outputs.commit_sha }}
    steps:
      # Clone the repository at the current ref (branch or default branch).
      # fetch-depth: 0 ensures we have full history for git operations.
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      # Parse the version string from the user-provided tag (strip "v" prefix).
      - name: Determine release version
        id: version
        run: |
          TAG="${{ github.event.inputs.tag }}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      # Update the version in meson.build (only the 'version' field).
      - name: Update meson.build
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          sed -i "/^\s*project(/,/)/ { /meson_version/! s/version\s*:\s*'[^']*'/version : '$VERSION'/ }" meson.build

      # Update AC_INIT version and RELEASE_DATE in configure.ac.
      - name: Update configure.ac
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          DATE=$(date +%Y-%m-%d)
          sed -i "s/\(AC_INIT(\[GtkHash\], \[\)[^]]*/\1${VERSION}/" configure.ac
          sed -i "s/\(AC_SUBST(\[RELEASE_DATE\], \[\)[^]]*/\1${DATE}/" configure.ac

      # Prepend the new version and date to the NEWS file.
      - name: Update NEWS
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          DATE=$(date +%Y-%m-%d)
          sed -i "2a\\${VERSION} (${DATE})\n" NEWS

      # Update the AppVersion in the Inno Setup configuration.
      - name: Update Inno Setup version
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          sed -i "s/^AppVersion=.*/AppVersion=${VERSION}/" msys2/gtkhash.iss

      # Commit all version bumps and push to the same branch.
      # Use the GitHub Actions bot identity.
      - name: Commit and push changes
        id: push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # required for push authentication
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add meson.build configure.ac NEWS msys2/gtkhash.iss
          git commit -m "chore: bump version to ${{ steps.version.outputs.version }}"
          git push origin HEAD:${{ github.ref_name }}
          echo "commit_sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

  # ==========================================================================
  # SOURCE DISTRIBUTION (Linux / Ubuntu 22.04)
  # ==========================================================================
  source-dist:
    name: Source distribution
    runs-on: ubuntu-22.04
    # Wait for version bump if it ran, otherwise start immediately.
    needs: bump-version
    outputs:
      version: ${{ steps.version.outputs.version }}   # expose version for downstream jobs
    steps:
      # Checkout the code at the bumped commit (if manual) or the tag ref (if push).
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.bump-version.outputs.commit_sha || github.ref }}
          fetch-depth: 0

      # Determine the version string from the event (push tag or manual input).
      - name: Determine release version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="${{ github.event.inputs.tag }}"
          fi
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      # Install all necessary build dependencies for a full Linux build.
      - name: Install build dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            python3-pip \
            ninja-build \
            gettext \
            appstream \
            pkg-config \
            libglib2.0-dev \
            libgtk-3-dev \
            libgcrypt20-dev \
            nettle-dev \
            libb2-dev \
            libmbedtls-dev \
            libssl-dev \
            linux-libc-dev \
            librsvg2-bin \
            libxml2-utils \
            at-spi2-core \
            xvfb \
            gnome-icon-theme \
            libnautilus-extension-dev \
            libnemo-extension-dev \
            libcaja-extension-dev \
            libthunarx-3-dev

          python3 -m pip install --user --upgrade pip
          python3 -m pip install --user "meson==1.11.1"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Configure the build with all optional features enabled.
      - name: Meson setup
        run: |
          meson setup build \
            --buildtype=debug \
            -Dglib-checksums=true \
            -Dlinux-crypto=true \
            -Dnettle=true \
            -Dmbedtls=true \
            -Dlibcrypto=true \
            -Dbuild-nautilus=true \
            -Dbuild-nemo=true \
            -Dbuild-caja=true \
            -Dbuild-thunar=true

      # Generate compressed tarballs (gztar and xztar) without running tests.
      - name: Create distribution tarballs
        run: |
          meson dist -C build --formats gztar,xztar --no-tests --allow-dirty

      # Compute SHA256 checksums for each tarball (for release integrity).
      - name: Generate SHA256 checksums
        run: |
          cd build/meson-dist
          for f in *.tar.gz *.tar.xz; do
            sha256sum "$f" > "${f}.sha256"
          done
          rm -f *.sha256sum

      # Upload source tarballs and checksums as a named artifact.
      - name: Upload source artifacts
        uses: actions/upload-artifact@v7
        with:
          name: source-dist
          path: build/meson-dist/*
          retention-days: 30

  # ==========================================================================
  # WINDOWS BUILDS (ucrt64 and mingw64)
  # ==========================================================================
  windows-build:
    name: Windows ${{ matrix.sys }}
    runs-on: windows-latest
    needs: bump-version
    strategy:
      fail-fast: false   # continue other builds if one fails
      matrix:
        sys:
          - mingw64   # MSYS2 environment with MINGW64
          - ucrt64    # MSYS2 environment with UCRT64
    defaults:
      run:
        shell: msys2 {0}   # All steps default to MSYS2 bash unless overridden
    steps:
      # Prevent line-ending conversion issues on Windows.
      - run: git config --global core.autocrlf input
        shell: bash

      # Checkout code at the appropriate ref.
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.bump-version.outputs.commit_sha || github.ref }}
          fetch-depth: 0

      # Determine version string for the Windows build (similar to Linux job).
      - name: Determine version for Windows build
        id: win_version
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="${{ github.event.inputs.tag }}"
          fi
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
        shell: bash

      # Setup MSYS2 with the selected environment and required packages.
      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.sys }}
          update: true
          install: >-
            git
            base-devel
            tree
            zip
          pacboy: >-
            toolchain:p
            gtk3:p
            adwaita-icon-theme:p
            libgcrypt:p
            meson:p
            imagemagick:p

      # Build and install GtkHash using makepkg-mingw in the MSYS2 environment.
      # This also runs the test suite and produces a package.
      - name: Run makepkg-mingw (Build & Test & Install)
        run: |
          git archive --prefix gtkhash/ -o msys2/mingw-w64-gtkhash/gtkhash.tar.gz HEAD
          cd msys2/mingw-w64-gtkhash
          PKGEXT=.pkg.tar.xz makepkg-mingw --noconfirm --noprogressbar --syncdeps --clean --cleanbuild --force
          pacman -U --noconfirm *.pkg.tar.xz

      # Bundle the installed files into a portable directory using the custom script.
      - name: Run Modern Bundle Script
        working-directory: ./msys2
        run: |
          chmod +x bundle.sh
          ./bundle.sh

      # Zip the portable directory into a release asset.
      - name: Create ZIP Archive
        working-directory: ./msys2/dist
        run: |
          zip -r ../../gtkhash-${{ matrix.sys }}-portable.zip ./*

      # Build the Windows installer (.exe) using Inno Setup 6 (native Windows command).
      - name: Build Inno Setup Installer (.exe)
        working-directory: msys2
        shell: cmd
        run: |
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" gtkhash.iss

      # Move the generated installer to the repository root for artifact upload.
      - name: Move Installer to root
        working-directory: msys2
        shell: bash
        run: |
          mv gtkhash-installer.exe ../gtkhash-${{ matrix.sys }}-installer.exe

      # Upload the portable zip and installer exe as a matrix-specific artifact.
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-${{ matrix.sys }}
          path: |
            gtkhash-${{ matrix.sys }}-portable.zip
            gtkhash-${{ matrix.sys }}-installer.exe
          retention-days: 30

  # ==========================================================================
  # CREATE GITHUB RELEASE
  # ==========================================================================
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [source-dist, windows-build]   # wait for both build jobs to finish
    if: success()   # only proceed if all needed jobs succeeded
    steps:
      # Checkout code again to get the NEWS file and commit history for release notes.
      - name: Checkout code (for release notes)
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.source-dist.outputs.commit_sha || github.ref }}
          fetch-depth: 0

      # Determine the final tag and version based on the triggering event.
      - name: Determine release version and tag
        id: meta
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="${{ github.event.inputs.tag }}"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      # Download all artifacts from the source-dist and windows-build jobs.
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts   # artifacts from each job will be in subdirectories

      # Organize and rename all release assets into a single directory.
      # Rename Windows files to include the version number (e.g., gtkhash-1.5.1-mingw64-installer.exe).
      - name: Prepare release assets directory
        run: |
          mkdir -p release-assets
          VERSION="${{ steps.meta.outputs.version }}"

          cp artifacts/source-dist/*.tar.gz artifacts/source-dist/*.tar.xz artifacts/source-dist/*.sha256 release-assets/

          for sys in mingw64 ucrt64; do
            if [ -d "artifacts/windows-$sys" ]; then
              for file in artifacts/windows-$sys/*; do
                base=$(basename "$file")
                newname=$(echo "$base" | sed "s/gtkhash-$sys/gtkhash-${VERSION}-$sys/")
                cp "$file" "release-assets/$newname"
              done
            fi
          done

          ls -la release-assets

      # Generate release notes by combining the NEWS file and a commit log.
      # Uses the previous tag to show commits since the last release, if available.
      - name: Generate release notes
        id: notes
        run: |
          TAG="${{ steps.meta.outputs.tag }}"

          echo "## Changes in this release" > release-notes.md
          echo "" >> release-notes.md
          if [ -f NEWS ]; then
            cat NEWS >> release-notes.md
          else
            echo "_(No NEWS file found.)_" >> release-notes.md
          fi

          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          echo "" >> release-notes.md
          if [ -n "$PREV_TAG" ]; then
            echo "## Commits since $PREV_TAG" >> release-notes.md
          else
            echo "## All commits" >> release-notes.md
          fi
          echo '```' >> release-notes.md
          git log --oneline ${PREV_TAG:+"${PREV_TAG}..HEAD"} >> release-notes.md
          echo '```' >> release-notes.md

          echo "notes_file=release-notes.md" >> $GITHUB_OUTPUT
          cat release-notes.md

      # Create the GitHub Release using the `gh` CLI.
      # If triggered by a tag push, the release is a draft; if manual, it is published immediately.
      - name: Create release (draft for push, publish for manual)
        id: create_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # needed for gh CLI authentication
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          TARGET_SHA=$(git rev-parse HEAD)

          if [ "${{ github.event_name }}" = "push" ]; then
            DRAFT="--draft"
          else
            DRAFT=""
          fi

          gh release create "$TAG" \
            $DRAFT \
            --target "$TARGET_SHA" \
            --title "$TAG" \
            --notes-file "release-notes.md" \
            release-assets/*

      # -----------------------------------------------------------------------
      # Optional: Update the Flathub manifest
      # -----------------------------------------------------------------------
      # If the FLATHUB_TOKEN secret is set, clone the Flathub repository,
      # update the tarball URL and SHA256, commit, and push.
      - name: Flathub manifest update (optional)
        if: env.FLATHUB_TOKEN != ''   # run only if the secret exists
        env:
          FLATHUB_TOKEN: ${{ secrets.FLATHUB_TOKEN }}
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          TAG="${{ steps.meta.outputs.tag }}"
          REPO="${{ github.repository }}"
          TARBALL_URL="https://github.com/${REPO}/releases/download/${TAG}/gtkhash-${VERSION}.tar.xz"

          SHA256_FILE="release-assets/gtkhash-${VERSION}.tar.xz.sha256"
          if [ ! -f "$SHA256_FILE" ]; then
            echo "::error::SHA256 file not found, cannot update Flathub."
            exit 1
          fi
          SHA256=$(awk '{print $1}' "$SHA256_FILE")

          git clone "https://x-access-token:${FLATHUB_TOKEN}@github.com/flathub/org.gtkhash.gtkhash.git" flathub-repo
          cd flathub-repo

          sed -i "s|url: .*|url: $TARBALL_URL|" org.gtkhash.gtkhash.yaml
          sed -i "s|sha256: .*|sha256: $SHA256|" org.gtkhash.gtkhash.yaml

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add org.gtkhash.gtkhash.yaml
          git commit -m "chore: update to ${TAG}"
          git push
        shell: bash

      # If FLATHUB_TOKEN is missing, emit a warning but do not fail the workflow.
      - name: Warn if Flathub token missing
        if: env.FLATHUB_TOKEN == ''
        run: echo "::warning::FLATHUB_TOKEN secret not set, skipping Flathub manifest update."
        env:
          FLATHUB_TOKEN: ${{ secrets.FLATHUB_TOKEN }}   # still reference the secret to trigger warning