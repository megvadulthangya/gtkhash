# ==============================================================================
# Release Workflow for GtkHash
# ==============================================================================
#
# This workflow automates the creation of a GitHub Release for GtkHash.
# It is triggered either by pushing a new version tag (v*) or manually via
# workflow_dispatch (useful for testing and one-off releases).
#
# Key design decisions (respecting the maintainer's preferences):
#   - No third-party actions are used for the release logic itself.
#     * GitHub CLI (`gh`) handles release creation and asset upload.
#     * The only "external" action is `msys2/setup-msys2@v2` which is the
#       de-facto standard for MSYS2 environments and cannot be avoided for
#       building Windows binaries.
#   - The workflow is **self-contained** – it does NOT depend on artifacts
#     from other workflows (compatibility-validation.yml, msys2.yml).
#     Instead it repeats the necessary build steps here. This guarantees
#     that the exact commit tagged is built and released, regardless of the
#     state of other workflow runs.
#   - When a real tag is pushed (`push` event) the release is created as a
#     **draft** so the maintainer can review/edit the release notes before
#     publishing.  When the workflow is triggered manually (`workflow_dispatch`)
#     the release is **published immediately**, because the user is actively
#     creating a release.
#   - Release notes are a hybrid: the full content of the `NEWS` file plus
#     a commit log since the previous tag.
#   - A Flathub manifest update step is optionally run if the secret
#     `FLATHUB_TOKEN` is available; otherwise it emits a warning.
#
# Required secrets/permissions:
#   - GITHUB_TOKEN with `contents: write` (set in repo Settings > Actions > General).
#   - (Optional) FLATHUB_TOKEN – a GitHub PAT with push access to
#     `flathub/org.gtkhash.gtkhash`.
# ==============================================================================

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.5.1)'
        required: true
        type: string

permissions:
  contents: write

jobs:

  # ==========================================================================
  # SOURCE DISTRIBUTION (Linux / Ubuntu 22.04)
  # ==========================================================================
  # Replicates the `dist` job from compatibility-validation.yml.
  # Produces:
  #   - gtkhash-<version>.tar.gz
  #   - gtkhash-<version>.tar.xz
  #   - Corresponding .sha256 checksum files
  # ==========================================================================
  source-dist:
    name: Source distribution
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine release version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="${{ github.event.inputs.tag }}"
          fi
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      # -----------------------------------------------------------------------
      # Patch meson.build to set the correct project version.
      # Uses a robust sed that replaces the first value inside single quotes
      # on the line that contains "version : '". This works regardless of
      # surrounding whitespace or the structure of the project() block.
      # -----------------------------------------------------------------------
      - name: Set project version
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          sed -i "/version\s*:\s*'/ s/'[^']*'/'$VERSION'/" meson.build
          # Print the modified project block for debugging
          sed -n "/^\s*project(/,/)/ p" meson.build

      - name: Install build dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            python3-pip \
            ninja-build \
            gettext \
            appstream \
            pkg-config \
            libglib2.0-dev \
            libgtk-3-dev \
            libgcrypt20-dev \
            nettle-dev \
            libb2-dev \
            libmbedtls-dev \
            libssl-dev \
            linux-libc-dev \
            librsvg2-bin \
            libxml2-utils \
            at-spi2-core \
            xvfb \
            gnome-icon-theme \
            libnautilus-extension-dev \
            libnemo-extension-dev \
            libcaja-extension-dev \
            libthunarx-3-dev

          python3 -m pip install --user --upgrade pip
          python3 -m pip install --user "meson==1.5.1"
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Meson setup
        run: |
          meson setup build \
            --buildtype=debug \
            -Dglib-checksums=true \
            -Dlinux-crypto=true \
            -Dnettle=true \
            -Dmbedtls=true \
            -Dlibcrypto=true \
            -Dbuild-nautilus=true \
            -Dbuild-nemo=true \
            -Dbuild-caja=true \
            -Dbuild-thunar=true

      - name: Create distribution tarballs
        run: |
          meson dist -C build --formats gztar,xztar --no-tests --allow-dirty

      - name: Generate SHA256 checksums
        run: |
          cd build/meson-dist
          for f in *.tar.gz *.tar.xz; do
            sha256sum "$f" > "${f}.sha256"
          done
          # Remove any automatically generated .sha256sum files
          rm -f *.sha256sum

      - name: Upload source artifacts
        uses: actions/upload-artifact@v7
        with:
          name: source-dist
          path: build/meson-dist/*
          retention-days: 30

  # ==========================================================================
  # WINDOWS BUILDS (ucrt64 and mingw64)
  # ==========================================================================
  # Replicates the Windows build from msys2.yml, producing:
  #   - gtkhash-<sys>-portable.zip
  #   - gtkhash-<sys>-installer.exe
  # ==========================================================================
  windows-build:
    name: Windows ${{ matrix.sys }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        sys:
          - mingw64
          - ucrt64
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - run: git config --global core.autocrlf input
        shell: bash

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # -----------------------------------------------------------------------
      # Retrieve the version from the source-dist job's output.
      # The source-dist job is a dependency of create-release, but not of
      # windows-build. We need the version here to patch meson.build before
      # the Windows build. We compute it independently from the tag/input.
      # -----------------------------------------------------------------------
      - name: Determine version for Windows build
        id: win_version
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="${{ github.event.inputs.tag }}"
          fi
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
        shell: bash

      # -----------------------------------------------------------------------
      # Patch meson.build so the embedded version matches the release tag.
      # This must happen before git archive or any build step.
      # -----------------------------------------------------------------------
      - name: Set project version (Windows)
        shell: bash
        run: |
          VERSION="${{ steps.win_version.outputs.version }}"
          sed -i "/version\s*:\s*'/ s/'[^']*'/'$VERSION'/" meson.build
          # Print the project line(s) for verification
          grep -E "project\(|version\s*:" meson.build

      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.sys }}
          update: true
          install: >-
            git
            base-devel
            tree
            zip
          pacboy: >-
            toolchain:p
            gtk3:p
            adwaita-icon-theme:p
            libgcrypt:p
            meson:p
            imagemagick:p

      - name: Run makepkg-mingw (Build & Test & Install)
        run: |
          git archive --prefix gtkhash/ -o msys2/mingw-w64-gtkhash/gtkhash.tar.gz HEAD
          cd msys2/mingw-w64-gtkhash
          PKGEXT=.pkg.tar.xz makepkg-mingw --noconfirm --noprogressbar --syncdeps --clean --cleanbuild --force
          pacman -U --noconfirm *.pkg.tar.xz

      - name: Run Modern Bundle Script
        working-directory: ./msys2
        run: |
          chmod +x bundle.sh
          ./bundle.sh

      - name: Create ZIP Archive
        working-directory: ./msys2/dist
        run: |
          zip -r ../../gtkhash-${{ matrix.sys }}-portable.zip ./*

      - name: Build Inno Setup Installer (.exe)
        working-directory: msys2
        shell: cmd
        run: |
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" gtkhash.iss

      - name: Move Installer to root
        working-directory: msys2
        shell: bash
        run: |
          mv gtkhash-installer.exe ../gtkhash-${{ matrix.sys }}-installer.exe

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-${{ matrix.sys }}
          path: |
            gtkhash-${{ matrix.sys }}-portable.zip
            gtkhash-${{ matrix.sys }}-installer.exe
          retention-days: 30

  # ==========================================================================
  # CREATE GITHUB RELEASE
  # ==========================================================================
  # Collects all artifacts, generates release notes, creates a release
  # (draft for tag pushes, published for manual runs), and optionally
  # updates the Flathub manifest.
  # ==========================================================================
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [source-dist, windows-build]
    if: success()
    steps:
      - name: Checkout code (for release notes)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine release version and tag
        id: meta
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="${{ github.event.inputs.tag }}"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Prepare release assets directory
        run: |
          mkdir -p release-assets
          VERSION="${{ steps.meta.outputs.version }}"

          # Source tarballs and their .sha256 files
          cp artifacts/source-dist/*.tar.gz artifacts/source-dist/*.tar.xz artifacts/source-dist/*.sha256 release-assets/

          # Windows artifacts: rename to include version
          for sys in mingw64 ucrt64; do
            if [ -d "artifacts/windows-$sys" ]; then
              for file in artifacts/windows-$sys/*; do
                base=$(basename "$file")
                newname=$(echo "$base" | sed "s/gtkhash-$sys/gtkhash-${VERSION}-$sys/")
                cp "$file" "release-assets/$newname"
              done
            fi
          done

          ls -la release-assets

      - name: Generate release notes
        id: notes
        run: |
          TAG="${{ steps.meta.outputs.tag }}"

          echo "## Changes in this release" > release-notes.md
          echo "" >> release-notes.md
          if [ -f NEWS ]; then
            cat NEWS >> release-notes.md
          else
            echo "_(No NEWS file found.)_" >> release-notes.md
          fi

          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          echo "" >> release-notes.md
          if [ -n "$PREV_TAG" ]; then
            echo "## Commits since $PREV_TAG" >> release-notes.md
          else
            echo "## All commits" >> release-notes.md
          fi
          echo '```' >> release-notes.md
          git log --oneline ${PREV_TAG:+"${PREV_TAG}..HEAD"} >> release-notes.md
          echo '```' >> release-notes.md

          echo "notes_file=release-notes.md" >> $GITHUB_OUTPUT
          cat release-notes.md

      - name: Create release (draft for push, publish for manual)
        id: create_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          # Use full commit SHA as --target for a valid Git reference
          TARGET_SHA=$(git rev-parse HEAD)

          if [ "${{ github.event_name }}" = "push" ]; then
            DRAFT="--draft"
          else
            DRAFT=""
          fi

          gh release create "$TAG" \
            $DRAFT \
            --target "$TARGET_SHA" \
            --title "$TAG" \
            --notes-file "release-notes.md" \
            release-assets/*

      # -----------------------------------------------------------------------
      # Optional: Update the Flathub manifest
      # -----------------------------------------------------------------------
      - name: Flathub manifest update (optional)
        if: env.FLATHUB_TOKEN != ''
        env:
          FLATHUB_TOKEN: ${{ secrets.FLATHUB_TOKEN }}
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          TAG="${{ steps.meta.outputs.tag }}"
          REPO="${{ github.repository }}"
          TARBALL_URL="https://github.com/${REPO}/releases/download/${TAG}/gtkhash-${VERSION}.tar.xz"

          SHA256_FILE="release-assets/gtkhash-${VERSION}.tar.xz.sha256"
          if [ ! -f "$SHA256_FILE" ]; then
            echo "::error::SHA256 file not found, cannot update Flathub."
            exit 1
          fi
          SHA256=$(awk '{print $1}' "$SHA256_FILE")

          git clone "https://x-access-token:${FLATHUB_TOKEN}@github.com/flathub/org.gtkhash.gtkhash.git" flathub-repo
          cd flathub-repo

          sed -i "s|url: .*|url: $TARBALL_URL|" org.gtkhash.gtkhash.yaml
          sed -i "s|sha256: .*|sha256: $SHA256|" org.gtkhash.gtkhash.yaml

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add org.gtkhash.gtkhash.yaml
          git commit -m "chore: update to ${TAG}"
          git push
        shell: bash

      - name: Warn if Flathub token missing
        if: env.FLATHUB_TOKEN == ''
        run: echo "::warning::FLATHUB_TOKEN secret not set, skipping Flathub manifest update."
        env:
          FLATHUB_TOKEN: ${{ secrets.FLATHUB_TOKEN }}